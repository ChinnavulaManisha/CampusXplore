databases:
  - name: campusxplore-db
    databaseName: campusxplore_db
    user: campusxplore_user
    plan: free

services:
  - type: web
    name: campusxplore-api
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campusxplore-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "campusxplore-api.onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173"
      - key: PYTHON_VERSION
        value: "3.12.0"
